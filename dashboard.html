<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theology 6 — Class Dashboard</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  /* ============================================================
     Belen · Theology 6 — Class Dashboard
     A self-contained page meant to be embedded in your Blackbaud
     Bulletin board (see the embed instructions we discussed).
     Palette is tuned to your Blackbaud site: navy header + link-blue.
     You normally only edit the CONFIG block in the <script> below —
     you shouldn't need to touch this CSS.
     ============================================================ */
  :root{
    --navy:#1B2A4A; --blue:#1D6FBF; --accent:#1B6EC2;
    --ink:#2A2E33; --mut:#6B7075; --line:#E3E7EC; --card:#FFFFFF;
    --due:#C0392B; --due-bg:#FBE9E7; --ok:#1E7D53; --ok-bg:#E7F4EC;
    --band:#C2D6F0; --ground:#F4F6F8; --radius:12px;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 6px 22px -12px rgba(20,30,50,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Helvetica Neue",Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased; padding:16px;
  }
  .wrap{max-width:860px; margin:0 auto}
  .block{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:16px}
  .block:last-child{margin-bottom:0}
  .block-h{display:flex; align-items:center; gap:9px; padding:12px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:15px; color:var(--navy)}
  .block-h .ic{font-size:17px; line-height:1}
  .block-b{padding:15px 16px}

  /* ---- Today's Agenda ---- */
  .agenda-hd{background:var(--navy); background:linear-gradient(100deg,var(--navy),var(--blue)); padding:15px 17px; color:#fff}
  .agenda-hd .d{font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--band)}
  .agenda-hd .t{font-size:21px; font-weight:700; margin-top:2px}
  .arow{display:grid; grid-template-columns:132px 1fr; gap:10px; padding:11px 17px; border-bottom:1px solid #EEF0F3; align-items:start}
  .arow:last-child{border-bottom:none}
  .arow .lab{font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); padding-top:2px}
  .arow .val{font-size:14.5px}
  .arow ol{margin:0; padding-left:20px} .arow ol li{margin:2px 0}
  .chip{display:inline-block; background:var(--due-bg); color:var(--due); font-weight:700; font-size:12.5px; padding:2px 10px; border-radius:999px}
  .chip.ok{background:var(--ok-bg); color:var(--ok)}
  .soft{color:var(--mut)}

  /* ---- Quick Links ---- */
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  .quick a{display:flex; flex-direction:column; gap:3px; text-decoration:none; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:13px; color:var(--navy); font-weight:700; font-size:13.5px; transition:border-color .12s, box-shadow .12s, transform .12s}
  .quick a:hover{border-color:var(--blue); box-shadow:0 4px 14px -8px rgba(20,30,50,.35); transform:translateY(-1px)}
  .quick a .qi{font-size:20px}
  .quick a .qs{font-weight:500; font-size:12px; color:var(--mut)}

  /* ---- This Week ---- */
  .week{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .wd{background:var(--ground); border:1px solid var(--line); border-radius:10px; padding:10px}
  .wd.today{background:#EAF2FB; border-color:var(--blue)}
  .wd .wdh{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--navy)}
  .wd .wdd{font-size:11px; color:var(--mut); margin:1px 0 5px}
  .wd .wdt{font-size:12.5px}
  .wd .tag{display:inline-block; margin-top:5px; background:var(--due-bg); color:var(--due); font-weight:700; font-size:11px; padding:1px 7px; border-radius:999px}

  /* ---- Responsive: reflow for phones / narrow embeds ---- */
  @media (max-width:680px){
    .quick{grid-template-columns:repeat(2,1fr)}
    .week{grid-template-columns:repeat(2,1fr)}
    .arow{grid-template-columns:1fr; gap:2px; padding:10px 15px}
    .arow .lab{padding-top:0}
  }

  footer{max-width:860px; margin:14px auto 0; text-align:center; color:var(--mut); font-size:12px}
  footer .amdg{font-weight:700; letter-spacing:.28em; color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap" id="dash"></div>
  <footer><span class="amdg">A · M · D · G</span></footer>

<script>
/* ============================================================================
   ✏️  EDIT HERE — this is the only part you change day to day.
   Update the agenda for today, then commit & push. The page updates live.
   ============================================================================ */
const CONFIG = {
  // Header of the agenda card:
  dateText: "Wednesday, Aug 20 · Day 2 (B)",   // the class day + A/B
  autoToday: false,  // true = show the real live date instead ("Today · …")

  agenda: {
    prayer: "Sign of the Cross & our Class Prayer",
    ican:   "explain what makes Belen a Jesuit community.",
    doList: [
      "Warm-up: one word for “community” (5 min)",
      "Notes: the Ignatian Core Values (15 min)",
      "Hallway hunt: find your value (15 min)",
      "Exit ticket on Padlet (5 min)"
    ],
    // Homework / what's due next. Set chip + text, or leave text:"" for none.
    dueChip: "Fri · Day 3",
    dueText: "Read p. 12–14 + answer Q1–3",
    close:  "A.M.D.G. — For the greater glory of God"
  },

  // Quick links — replace each href:"#" with a real web address.
  quickLinks: [
    { icon:"📗", title:"Syllabus",     sub:"Rules & grading",  href:"#" },
    { icon:"🙏", title:"Our Prayers",  sub:"Print + audio",    href:"#" },
    { icon:"📥", title:"Turn in Work", sub:"How-to (2 min)",   href:"#" },
    { icon:"🗂️", title:"This Unit",    sub:"Unit 1 Topic",     href:"#" }
  ],

  // This week — mark the current class with today:true. Optional tag for a due date.
  week: [
    { day:"Mon", date:"Aug 18 · A", text:"Welcome & syllabus" },
    { day:"Wed", date:"Aug 20 · B", text:"Jesuit community", today:true },
    { day:"Fri", date:"Aug 22 · A", text:"Core Values", tag:"Q1–3 due" },
    { day:"Mon", date:"Aug 25 · B", text:"The Church family" },
    { day:"Wed", date:"Aug 27 · A", text:"Prayer & worship" }
  ]
};
/* ======================  end of edit section  ============================== */

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function render(){
  const a = CONFIG.agenda;
  const today = CONFIG.autoToday
    ? new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})
    : '';
  const eyebrow = CONFIG.autoToday ? `📌 Today · ${today}` : `📅 ${esc(CONFIG.dateText)}`;
  const subline = CONFIG.autoToday ? esc(CONFIG.dateText) : '';

  const doList = (a.doList||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  const dueVal = a.dueText
    ? `<span class="chip">${esc(a.dueChip||'Due')}</span>&nbsp; ${esc(a.dueText)}`
    : `<span class="soft">— nothing due —</span>`;

  const agenda = `
    <div class="block">
      <div class="agenda-hd">
        <div class="d">${eyebrow}${subline?` &middot; ${subline}`:''}</div>
        <div class="t">Today’s Agenda</div>
      </div>
      <div class="arow"><div class="lab">🙏 Prayer</div><div class="val">${esc(a.prayer)}</div></div>
      <div class="arow"><div class="lab">🎯 I can…</div><div class="val">${esc(a.ican)}</div></div>
      <div class="arow"><div class="lab">📝 We’ll do</div><div class="val"><ol>${doList}</ol></div></div>
      <div class="arow"><div class="lab">📚 Due next</div><div class="val">${dueVal}</div></div>
      <div class="arow"><div class="lab">✝️ We close</div><div class="val">${esc(a.close)}</div></div>
    </div>`;

  const links = (CONFIG.quickLinks||[]).map(l=>
    `<a href="${esc(l.href)}"><span class="qi">${esc(l.icon)}</span>${esc(l.title)}<span class="qs">${esc(l.sub)}</span></a>`
  ).join('');
  const quick = `
    <div class="block">
      <div class="block-h"><span class="ic">🔗</span> Quick Links — everything you need, one tap</div>
      <div class="block-b"><div class="quick">${links}</div></div>
    </div>`;

  const days = (CONFIG.week||[]).map(w=>
    `<div class="wd${w.today?' today':''}">
       <div class="wdh">${esc(w.day)}</div>
       <div class="wdd">${esc(w.date)}</div>
       <div class="wdt">${esc(w.text)}${w.today?' <span class="soft">(today)</span>':''}</div>
       ${w.tag?`<span class="tag">${esc(w.tag)}</span>`:''}
     </div>`
  ).join('');
  const week = `
    <div class="block">
      <div class="block-h"><span class="ic">🗓️</span> This Week at a Glance</div>
      <div class="block-b"><div class="week">${days}</div></div>
    </div>`;

  document.getElementById('dash').innerHTML = agenda + quick + week;
}
render();
</script>
</body>
</html>
