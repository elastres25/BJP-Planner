# No build step — the app is a single static HTML file served from the repo
# root. "publish = ." tells Netlify to deploy the repo root as-is, overriding
# any publish-directory value configured in the dashboard.
[build]
  publish = "."
  command = ""

# Netlify serves index.html at "/" by default; our app file is named
# belen-planner_11.html, so this rewrite makes "/" serve it directly.
[[redirects]]
  from = "/"
  to = "/belen-planner_11.html"
  status = 200

# The root rewrite serves the app WITHOUT the ?v= cache-buster, so force the
# HTML to always revalidate — otherwise the CDN/browser can serve a stale app
# and you never see new features or the in-app "Update" prompt.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/belen-planner_11.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
